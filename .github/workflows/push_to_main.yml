name: safety

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  MIRROR_URL: git@github.com:EpitechPGE3-2026/G-SVR-500-LIL-5-1-survivor-10.git

permissions:
  contents: read
  pull-requests: write

jobs:
  check_repo:
    runs-on: ubuntu-latest
    outputs:
      is_mirror: ${{ steps.detect.outputs.is_mirror }}

    steps:
      - name: Detect mirror repository
        id: detect
        run: |
          repo_ssh_url="git@github.com:${GITHUB_REPOSITORY}.git"
          is_mirror=false

          if [ "$repo_ssh_url" = "$MIRROR_URL" ]; then
            is_mirror=true
          fi

          echo "is_mirror=$is_mirror" >> "$GITHUB_OUTPUT"

  push_to_mirror:
    needs: check_repo
    if: needs.check_repo.outputs.is_mirror == 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
